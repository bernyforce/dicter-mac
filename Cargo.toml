[workspace]
members = ["crates/diction-core", "crates/diction-audio", "crates/diction-platform", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
diction-core = { path = "crates/diction-core" }
diction-audio = { path = "crates/diction-audio" }
diction-platform = { path = "crates/diction-platform" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
